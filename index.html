<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0b">
  <title>Fantasty</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; font-family:Arial,Helvetica,sans-serif;
      background:radial-gradient(circle at top,#242424 0,#101010 42%,#050505 100%);
      color:#fff; display:flex; justify-content:center; padding:28px 16px;
    }
    .wrap{width:100%;max-width:520px;text-align:center}
    .avatar{
      width:112px;height:112px;border-radius:50%;object-fit:cover;
      border:3px solid #fff; box-shadow:0 10px 35px rgba(0,0,0,.45);
      background:#fff;
    }
    h1{font-size:30px;margin:15px 0 6px;letter-spacing:.5px}
    .handle{color:#aaa;font-size:14px;margin-bottom:10px}
    .bio{color:#ddd;font-size:14px;line-height:1.6;margin:0 auto 22px;max-width:380px}
    .links{display:grid;gap:13px}
    a{
      text-decoration:none;color:#fff;background:#171717;border:1px solid #303030;
      padding:16px 18px;border-radius:16px;font-weight:700;display:flex;
      align-items:center;justify-content:center;gap:10px;transition:.2s;
      box-shadow:0 8px 22px rgba(0,0,0,.22)
    }
    a:hover{transform:translateY(-2px);background:#222;border-color:#555}
    .wa{background:#183b24;border-color:#2f6b43}
    .wa:hover{background:#21502f}
    .soon{margin-top:25px;padding:17px;border-radius:16px;border:1px dashed #444;color:#aaa;font-size:13px}
    footer{margin-top:28px;color:#666;font-size:12px}
  </style>
</head>
<body>
  <main class="wrap">
    <img class="avatar" src="logo.jpg" alt="Logo Fantasty">
    <h1>Fantasty</h1>
    <div class="handle">@fai8zzz</div>
    <p class="bio">Welcome to Fantasty.<br>Follow, connect, and stay tuned for what's coming next.</p>

    <div class="links">
      <a href="https://www.tiktok.com/@fai8zzz?_r=1&_t=ZS-9A13XtMXSlA" target="_blank" rel="noopener">🎵 TikTok</a>
      <a href="https://www.instagram.com/its_faizies?stkn=MWNxazZxb3I2dHFscg==" target="_blank" rel="noopener">📸 Instagram</a>
      <a class="wa" href="https://wa.me/6285178089604" target="_blank" rel="noopener">💬 WhatsApp</a>
    </div>

    <div class="soon">🛍️ Produk & layanan — segera hadir</div>
    <footer>© 2026 Fantasty</footer>
  </main>
</body>
</html>
